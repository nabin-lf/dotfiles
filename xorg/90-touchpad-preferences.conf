Section "InputClass"
    Identifier "Touchpad preferences"
    MatchIsTouchpad "on"
    Driver "libinput"

    # A light tap is a left click; use two fingers for a right click.
    Option "Tapping" "on"
    Option "ClickMethod" "clickfinger"

    # Scroll in the preferred direction for this setup.
    Option "NaturalScrolling" "off"
    Option "DisableWhileTyping" "on"
EndSection

# This external mouse reports its wheel in the opposite orientation.
# Keep the touchpad section above unchanged; this applies only to the mouse.
Section "InputClass"
    Identifier "External mouse scroll direction"
    MatchProduct "MSFT0001:01 06CB:7F28 Mouse"
    MatchIsPointer "on"
    Driver "libinput"
    Option "NaturalScrolling" "on"
EndSection
