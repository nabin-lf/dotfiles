general {
    colors = true
    interval = 5
    color_good = "#a6e3a1"
    color_degraded = "#f9e2af"
    color_bad = "#f38ba8"
}

order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "volume master"
order += "tztime local"

wireless _first_ {
    format_up = "  %essid"
    format_down = "  offline"
}

ethernet _first_ {
    format_up = "󰈀  %ip"
    format_down = ""
}

battery all {
    format = "  %percentage"
    format_down = "  charging"
    status_bat = ""
    status_chr = ""
    status_unk = "?"
    status_full = ""
    low_threshold = 15
}

volume master {
    format = "  %volume"
    format_muted = "󰖁  muted"
    device = "default"
    mixer = "Master"
    mixer_idx = 0
}

tztime local {
    format = "  %a, %b %d  %H:%M"
}
